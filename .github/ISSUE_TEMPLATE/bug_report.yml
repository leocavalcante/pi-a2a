name: Bug report
description: Report a problem you can reproduce with pi-a2a.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** don't include credentials, tokens, private agent endpoints, prompts, conversation content, attachments, project files, raw logs, or screenshots that show them. Use synthetic or redacted examples. To report a vulnerability, use the private form in [SECURITY.md](https://github.com/leocavalcante/pi-a2a/blob/main/SECURITY.md) instead.
  - type: input
    id: extension-version
    attributes:
      label: pi-a2a version
      description: Shown by `pi list`, or in your package.json for SDK use. Enter `unknown` if unavailable.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      description: Run `pi --version`. Enter `unknown` if unavailable or not using the Pi extension.
      placeholder: 1.5.2
    validations:
      required: true
  - type: input
    id: durable-version
    attributes:
      label: Pi Durable version
      description: If you use Pi Durable, include its version. Otherwise enter `not used`.
      placeholder: 1.5.2
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`, if available.
      placeholder: v22.19.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: How you use pi-a2a
      options:
        - Pi extension from npm
        - Pi extension from GitHub
        - Pi extension from a local checkout
        - Client SDK without Pi
        - Pi Durable adapter
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic prompts and agent data. Do not include private endpoint URLs or credentials.
      placeholder: |
        1. Configure a local test agent.
        2. Run a Pi A2A command or SDK request.
        3. Describe the sanitized result.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: Describe what you expected and what happened instead, without private content.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Share only sanitized details. Don't attach raw logs, message bodies, task artifacts, or transcripts.
